# OneMax - menu startowe Limine (BIOS i UEFI).
# Ten sam plik dziala na plycie ISO i na obrazie dysku BIOS (boot/limine/limine.conf).
# Tlo to boot/grub/background.png z zestawu logo bootowania.

timeout: 5
interface_branding: OneMax 0.1
wallpaper: boot():/boot/limine/background.png
wallpaper_style: stretched

/OneMax 0.1
    protocol: linux
    path: boot():/boot/vmlinuz-onemax
    module_path: boot():/boot/initramfs-onemax.cpio.gz
    cmdline: quiet loglevel=3 console=tty0

/OneMax 0.1 (verbose boot)
    protocol: linux
    path: boot():/boot/vmlinuz-onemax
    module_path: boot():/boot/initramfs-onemax.cpio.gz
    cmdline: loglevel=7 console=tty0

/OneMax 0.1 (diagnostic shell before start)
    protocol: linux
    path: boot():/boot/vmlinuz-onemax
    module_path: boot():/boot/initramfs-onemax.cpio.gz
    cmdline: loglevel=7 console=tty0 onemax.shell
